# Windows targets: static CRT linkage so the resulting exe has no runtime DLL deps.
# musl targets are already fully static — no config needed for them.
#
# gnullvm targets are cross-compiled from Linux using llvm-mingw.
# msvc targets are kept for reference but require a Windows host or MSVC toolchain.

[target.aarch64-unknown-linux-musl]
strip = { path = "llvm-strip" }

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-pc-windows-gnullvm]
linker = "x86_64-w64-mingw32-clang"
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-gnullvm]
linker = "aarch64-w64-mingw32-clang"
rustflags = ["-C", "target-feature=+crt-static"]
